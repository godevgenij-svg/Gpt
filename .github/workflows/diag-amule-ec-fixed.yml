name: Verify fixed aMule EC API
on:
  push:
    branches: [ backend-pack-ready ]
    paths: [ '.github/workflows/diag-amule-ec-fixed.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          function WP($p,$s=40){$e=(Get-Date).AddSeconds($s);while((Get-Date)-lt$e){$c=New-Object Net.Sockets.TcpClient;try{$a=$c.BeginConnect('127.0.0.1',$p,$null,$null);if($a.AsyncWaitHandle.WaitOne(500)-and$c.Connected){$c.EndConnect($a);return $true}}catch{}finally{$c.Close()};Start-Sleep -Milliseconds 300};$false}
          function MD5Hex($s){$md5=[Security.Cryptography.MD5]::Create();try{$b=[Text.Encoding]::UTF8.GetBytes($s);([BitConverter]::ToString($md5.ComputeHash($b))).Replace('-','').ToLowerInvariant()}finally{$md5.Dispose()}}
          $t=Join-Path $env:RUNNER_TEMP ('amfix-'+[guid]::NewGuid().ToString('N'));New-Item -ItemType Directory $t -Force|Out-Null
          try {
            $z=Join-Path $t a.zip;&curl.exe -fL 'https://nightly.link/amule-org/amule/actions/artifacts/9246296823.zip' -o $z;$o=Join-Path $t o;Expand-Archive $z $o -Force;$inner=Get-ChildItem $o -Recurse -File -Filter '*Windows-x64*.zip'|Select-Object -First 1;$a=Join-Path $t a;Expand-Archive $inner.FullName $a -Force;$bin=(Get-ChildItem $a -Recurse -File -Filter amuleapi.exe|Select-Object -First 1).Directory.FullName
            $api=(Join-Path $bin amuleapi.exe);$apiCfg=$api.Replace('\','/');$apiCfg=$apiCfg.Replace([char]92,[char]47);$c=Join-Path $t cfg;New-Item -ItemType Directory $c -Force|Out-Null;$ecHash=MD5Hex 'diag_ec_password'
            @"
          [AmuleApi]
          Enabled=1
          BindAddress=127.0.0.1
          HttpPort=4713
          Path=$apiCfg

          [eMule]
          FirstRunWizardDone=1

          [ExternalConnect]
          AcceptExternalConnections=1
          RequireEncryption=0
          ECAddress=127.0.0.1
          ECPort=4712
          ECPassword=$ecHash
          "@|Set-Content (Join-Path $c amule.conf) -Encoding UTF8
            Write-Host "API_PATH=$apiCfg EC_HASH=$ecHash"
            &$api "--config-dir=$c" '--set-admin-pass=diagpassword';if($LASTEXITCODE){throw 'set api password failed'}
            $p=Start-Process (Join-Path $bin amuled.exe) -ArgumentList @("--config-dir=$c") -RedirectStandardOutput (Join-Path $c stdout.txt) -RedirectStandardError (Join-Path $c stderr.txt) -PassThru
            $ok=WP 4713 45
            if(-not$ok){Start-Sleep 1;Write-Host '--- MAIN LOG';$lf=Join-Path $c 'logfile';if(Test-Path $lf){Get-Content $lf -Tail 200|Out-Host};Write-Host '--- API LOG';$af=Join-Path $c 'amuleapi.log';if(Test-Path $af){Get-Content $af -Tail 200|Out-Host};throw 'aMule REST port 4713 did not open'}
            $v=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:4713/api/v0/version' -TimeoutSec 10;Write-Host "VERSION=$($v.StatusCode) $($v.Content)"
            $body=@{password='diagpassword'}|ConvertTo-Json -Compress;$login=Invoke-RestMethod 'http://127.0.0.1:4713/api/v0/auth/login?type=bearer' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 10
            Write-Host "ROLE=$($login.role) TOKEN=$([bool]$login.token)"
            if(-not$login.token-or([string]$login.role).ToLowerInvariant()-ne'admin'){throw 'admin login failed'}
          } finally {Get-Process -ErrorAction SilentlyContinue|Where-Object{$_.ProcessName-match'amule'}|Stop-Process -Force -ErrorAction SilentlyContinue}
