name: Stage 4 donor audit

on:
  workflow_dispatch:
  push:
    branches: [ stage4-donor-audit ]

jobs:
  audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Stage 2 base
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\ci2.part*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 30604) { throw "Unexpected Stage 2 base64 length" }
          [IO.File]::WriteAllBytes("Stage2.patch.xz", [Convert]::FromBase64String($b64))
          if ((Get-FileHash Stage2.patch.xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ff95c6073cde34ff3af0e082c06e5131273f4544a9ee81686d7420d9aba7f05b') { throw 'Stage 2 XZ SHA mismatch' }
          cmd /c "7z x Stage2.patch.xz -so > Stage2.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clone pinned BlackLink and apply Stage 2
        shell: pwsh
        run: |
          git clone https://github.com/zipper9/blacklink.git blacklink
          git -C blacklink checkout 1a72cfddca154da9070caca1b5a02df56d5498ab
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          & $patchExe -p2 -d blacklink -i "$PWD\Stage2.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $patchExe -p2 -d blacklink -i "$PWD\patches\GreyLink_Stage2_compilefix1.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $patchExe -p1 -d blacklink -i "$PWD\patches\GreyLink_RU_runtimefix.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = "blacklink\client\StringDefs.h"
          $t = Get-Content $p -Raw
          $t = $t -replace '(?m)^[ \t]*// Additional UI strings localized by the Russian localization patch\r?\n', ''
          $t = $t -replace '(?m)^[ \t]*// GreyBridge multi-network UI\r?\n', ''
          [IO.File]::WriteAllText((Resolve-Path $p), $t, [Text.UTF8Encoding]::new($false))

      - name: Reconstruct and apply Stage 3
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\stage3.part*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 24024) { throw "Unexpected Stage 3 base64 length" }
          [IO.File]::WriteAllBytes("Stage3.patch.xz", [Convert]::FromBase64String($b64))
          if ((Get-FileHash Stage3.patch.xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ed453da31122b6cec97566b119ff119c25cf34f9d3cc4b7b7cfd94b40926f8ff') { throw 'Stage 3 XZ SHA mismatch' }
          cmd /c "7z x Stage3.patch.xz -so > Stage3.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconstruct verify and apply Stage 4 donor
        shell: pwsh
        run: |
          $b64 = Get-Content "patches\stage4.b64" -Raw
          if ($b64.Length -ne 16592) { throw "Unexpected Stage 4 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("Stage4.patch.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash Stage4.patch.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne '436973d902c0b40df908de961eb829f86fca86b6e436febc013b4a32b3bc6815') { throw "Stage 4 XZ SHA mismatch: $xzHash" }
          cmd /c "7z x Stage4.patch.xz -so > Stage4.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchHash = (Get-FileHash Stage4.patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '1828691e8cd7407b915f1dcd5ae7d54a3243787eddce36610b65851098e4b063') { throw "Stage 4 patch SHA mismatch: $patchHash" }
          git -C blacklink apply --check ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect donor source and diff
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit\client, audit\windows, audit\compiled\Settings | Out-Null
          Copy-Item Stage4.patch audit\Stage4.patch
          Select-String -Path Stage4.patch -Pattern '^diff --git a/(.+?) b/(.+)$' | ForEach-Object { $_.Matches[0].Groups[2].Value } | Set-Content audit\stage4-patch-files.txt -Encoding utf8
          Get-ChildItem blacklink\client\ExternalSearch* -File | Copy-Item -Destination audit\client
          Get-ChildItem blacklink\windows\ExternalSearch* -File | Copy-Item -Destination audit\windows
          Copy-Item blacklink\compiled\Settings\ExternalSearch.xml audit\compiled\Settings\ExternalSearch.xml
          git -C blacklink diff --name-status | Out-File audit\full-files.txt -Encoding utf8
          git -C blacklink diff --stat | Out-File audit\full-stat.txt -Encoding utf8
          Get-FileHash Stage4.patch -Algorithm SHA256 | Format-List | Out-File audit\stage4-sha256.txt -Encoding utf8

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: Stage4-donor-audit
          path: audit
          retention-days: 30
          if-no-files-found: error
