name: Build GreyLink x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout GreyLink CI
        uses: actions/checkout@v4

      - name: Reconstruct and verify GreyLink Stage 2 patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\ci2.part*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 patch chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 30604) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\GreyLink_Stage2_compile.patch.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash "$PWD\GreyLink_Stage2_compile.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne 'ff95c6073cde34ff3af0e082c06e5131273f4544a9ee81686d7420d9aba7f05b') { throw "XZ SHA256 mismatch: $xzHash" }
          cmd /c "7z x GreyLink_Stage2_compile.patch.xz -so > GreyLink_Stage2_compile.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchHash = (Get-FileHash "$PWD\GreyLink_Stage2_compile.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'c120d913ac679d4b494d6ac7877b50c1e96beb431dac5bbc4912cf617ab31999') { throw "Patch SHA256 mismatch: $patchHash" }

      - name: Clone pinned BlackLink upstream
        shell: pwsh
        run: |
          git clone https://github.com/zipper9/blacklink.git blacklink
          git -C blacklink checkout 1a72cfddca154da9070caca1b5a02df56d5498ab
          $actual = (git -C blacklink rev-parse HEAD).Trim()
          if ($actual -ne '1a72cfddca154da9070caca1b5a02df56d5498ab') { throw "Wrong upstream commit: $actual" }

      - name: Apply GreyLink Stage 2 patch
        shell: pwsh
        run: |
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          if (-not (Test-Path $patchExe)) { throw "patch.exe not found: $patchExe" }
          & $patchExe -p2 -d blacklink -i "$PWD\GreyLink_Stage2_compile.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply MakeDefs hang hotfix
        shell: pwsh
        run: |
          git -C blacklink apply --check ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanitize and validate StringDefs for MakeDefs
        shell: pwsh
        run: |
          $path = "blacklink\client\StringDefs.h"
          $text = Get-Content $path -Raw
          $text = $text -replace '(?m)^[ \t]*// Additional UI strings localized by the Russian localization patch\r?\n', ''
          $text = $text -replace '(?m)^[ \t]*// GreyBridge multi-network UI\r?\n', ''
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          $lines = Get-Content $path
          $bad = @()
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            if ($line.Length -lt 5) { continue }
            if ($line.Contains('// @Strings: ') -or $line.Contains('// @Names: ') -or $line.Contains('// @DontAdd') -or $line.Contains('// @Prolog: ')) { continue }
            if (-not $line.Contains(',')) { $bad += "line $($i + 1): $line" }
          }
          if ($bad.Count -gt 0) { throw ("Unsafe StringDefs lines for MakeDefs:`n" + ($bad -join "`n")) }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure BlackLink VS2019 build prerequisites
        timeout-minutes: 20
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          if (-not (Test-Path $setup)) { throw "Visual Studio setup.exe not found" }
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio installation not found" }

          function Find-V142Cl {
            Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter cl.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\14\.29[^\\]*\\bin\\Hostx64\\x64\\cl\.exe$' } |
              Select-Object -First 1
          }
          function Find-V142Atl {
            Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter atlbase.h -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\14\.29[^\\]*\\atlmfc\\include\\atlbase\.h$' } |
              Select-Object -First 1
          }
          function Find-Win10SdkFile([string]$name, [string]$subtree) {
            $root = "${env:ProgramFiles(x86)}\Windows Kits\10\$subtree"
            if (-not (Test-Path $root)) { return $null }
            Get-ChildItem -Path $root -Filter $name -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\10\.0\.19041\.0\\' } |
              Select-Object -First 1
          }

          $cl = Find-V142Cl
          $atl = Find-V142Atl
          $windowsH = Find-Win10SdkFile 'Windows.h' 'Include'
          $rc = Find-Win10SdkFile 'rc.exe' 'bin'
          $mt = Find-Win10SdkFile 'mt.exe' 'bin'

          if (-not $cl -or -not $atl -or -not $windowsH -or -not $rc -or -not $mt) {
            Write-Host "Installing complete BlackLink prerequisite set into $vsPath"
            $args = @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64',
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
              '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041',
              '--quiet', '--norestart'
            )
            $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Visual Studio Installer failed with exit code $($p.ExitCode)" }
          }

          $cl = Find-V142Cl
          $atl = Find-V142Atl
          $windowsH = Find-Win10SdkFile 'Windows.h' 'Include'
          $rc = Find-Win10SdkFile 'rc.exe' 'bin'
          $mt = Find-Win10SdkFile 'mt.exe' 'bin'
          $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue

          if (-not $msbuild) { throw "MSBuild is missing after setup" }
          if (-not $cl) { throw "MSVC v142 x64 compiler cl.exe is missing" }
          if (-not $atl) { throw "v142 ATL atlbase.h is missing" }
          if (-not $windowsH) { throw "Windows 10 SDK 19041 Windows.h is missing" }
          if (-not $rc) { throw "Windows 10 SDK 19041 rc.exe is missing" }
          if (-not $mt) { throw "Windows 10 SDK 19041 mt.exe is missing" }

          Write-Host "MSBuild: $($msbuild.Source)"
          Write-Host "v142 cl.exe: $($cl.FullName)"
          Write-Host "v142 ATL: $($atl.FullName)"
          Write-Host "Windows SDK Windows.h: $($windowsH.FullName)"
          Write-Host "Windows SDK rc.exe: $($rc.FullName)"
          Write-Host "Windows SDK mt.exe: $($mt.FullName)"

      - name: Build Release x64
        timeout-minutes: 30
        shell: pwsh
        run: |
          msbuild blacklink\blacklink_2019.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /verbosity:normal /fl /flp:"logfile=msbuild.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSBuild diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GreyLink-msbuild-log
          path: msbuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "blacklink\compiled\blacklink_x64.exe")) { throw "blacklink_x64.exe was not produced" }
          Get-Item "blacklink\compiled\blacklink_x64.exe" | Format-List Name,Length,LastWriteTime

      - name: Package GreyLink
        shell: pwsh
        run: |
          if (Test-Path GreyLink-x64.zip) { Remove-Item GreyLink-x64.zip -Force }
          Compress-Archive -Path blacklink\compiled\* -DestinationPath GreyLink-x64.zip -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreyLink-x64
          path: GreyLink-x64.zip
          if-no-files-found: error
