name: Build BlackLink custom x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: blacklink-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CI files
        uses: actions/checkout@v4

      - name: Reconstruct and verify Stage 2 base patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\ci2.part*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 Stage 2 chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 30604) { throw "Unexpected Stage 2 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage2.patch.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash "$PWD\Stage2.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne 'ff95c6073cde34ff3af0e082c06e5131273f4544a9ee81686d7420d9aba7f05b') { throw "Stage 2 XZ SHA256 mismatch: $xzHash" }
          cmd /c "7z x Stage2.patch.xz -so > Stage2.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchHash = (Get-FileHash "$PWD\Stage2.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'c120d913ac679d4b494d6ac7877b50c1e96beb431dac5bbc4912cf617ab31999') { throw "Stage 2 patch SHA256 mismatch: $patchHash" }

      - name: Clone pinned BlackLink upstream
        shell: pwsh
        run: |
          git clone https://github.com/zipper9/blacklink.git blacklink
          git -C blacklink checkout 1a72cfddca154da9070caca1b5a02df56d5498ab
          $actual = (git -C blacklink rev-parse HEAD).Trim()
          if ($actual -ne '1a72cfddca154da9070caca1b5a02df56d5498ab') { throw "Wrong upstream commit: $actual" }

      - name: Apply Stage 2 base patch
        shell: pwsh
        run: |
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          if (-not (Test-Path $patchExe)) { throw "patch.exe not found: $patchExe" }
          & $patchExe -p2 -d blacklink -i "$PWD\Stage2.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply MakeDefs hang hotfix
        shell: pwsh
        run: |
          git -C blacklink apply --check ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Stage 2 compile fixes
        shell: pwsh
        run: |
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          & $patchExe -p2 -d blacklink -i "$PWD\patches\GreyLink_Stage2_compilefix1.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Russian runtime source fixes
        shell: pwsh
        run: |
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          & $patchExe -p1 -d blacklink -i "$PWD\patches\GreyLink_RU_runtimefix.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanitize StringDefs before feature patches
        shell: pwsh
        run: |
          $path = "blacklink\client\StringDefs.h"
          $text = Get-Content $path -Raw
          $text = $text -replace '(?m)^[ \t]*// Additional UI strings localized by the Russian localization patch\r?\n', ''
          $text = $text -replace '(?m)^[ \t]*// GreyBridge multi-network UI\r?\n', ''
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

      - name: Reconstruct verify and apply Stage 3 external search patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\stage3.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 Stage 3 chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 24024) { throw "Unexpected Stage 3 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage3.patch.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash "$PWD\Stage3.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne 'ed453da31122b6cec97566b119ff119c25cf34f9d3cc4b7b7cfd94b40926f8ff') { throw "Stage 3 XZ SHA256 mismatch: $xzHash" }
          cmd /c "7z x Stage3.patch.xz -so > Stage3.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchHash = (Get-FileHash "$PWD\Stage3.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '54eb0e38f49c355f48c4c0894dbd527bc5aa446295b8ea681aa233c52cabc58c') { throw "Stage 3 patch SHA256 mismatch: $patchHash" }
          git -C blacklink apply --check ../Stage3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconstruct verify and apply Stage 4 aMule and report patch
        shell: pwsh
        run: |
          $b64 = Get-Content "patches\stage4.b64" -Raw
          if ($b64.Length -ne 16592) { throw "Unexpected Stage 4 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage4.patch.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash "$PWD\Stage4.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne '436973d902c0b40df908de961eb829f86fca86b6e436febc013b4a32b3bc6815') { throw "Stage 4 XZ SHA256 mismatch: $xzHash" }
          cmd /c "7z x Stage4.patch.xz -so > Stage4.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchHash = (Get-FileHash "$PWD\Stage4.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '1828691e8cd7407b915f1dcd5ae7d54a3243787eddce36610b65851098e4b063') { throw "Stage 4 patch SHA256 mismatch: $patchHash" }
          git -C blacklink apply --check ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Final StringDefs safety validation
        shell: pwsh
        run: |
          $path = "blacklink\client\StringDefs.h"
          $lines = Get-Content $path
          $bad = @()
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            if ($line.Length -lt 5) { continue }
            if ($line.Contains('// @Strings: ') -or $line.Contains('// @Names: ') -or $line.Contains('// @DontAdd') -or $line.Contains('// @Prolog: ')) { continue }
            if (-not $line.Contains(',')) { $bad += "line $($i + 1): $line" }
          }
          if ($bad.Count -gt 0) { throw ("Unsafe StringDefs lines for MakeDefs:`n" + ($bad -join "`n")) }

      - name: Install and validate complete sharp Russian localization
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\ru3.part*" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 Russian localization chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 49052) { throw "Unexpected localization base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\ru-RU.xml.xz", [Convert]::FromBase64String($b64))
          $xzHash = (Get-FileHash "$PWD\ru-RU.xml.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne '6f166a6f7b9c851eed35067a709b077cb380973258799e4b60616948a1691aab') { throw "Localization XZ SHA256 mismatch: $xzHash" }
          New-Item -ItemType Directory -Force "blacklink\compiled\Lang" | Out-Null
          cmd /c "7z x ru-RU.xml.xz -so > blacklink\compiled\Lang\ru-RU.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseHash = (Get-FileHash "blacklink\compiled\Lang\ru-RU.xml" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne '46a333b6096be695b0f35d30cc99dfc028398739459705c5aad96123c2f5a6c8') { throw "Base localization XML SHA256 mismatch: $baseHash" }

          $langPath = (Resolve-Path "blacklink\compiled\Lang\ru-RU.xml")
          $text = [IO.File]::ReadAllText($langPath, [Text.Encoding]::UTF8)
          $text = $text.Replace('Revision="4-sharp"', 'Revision="5-sharp"')
          $marker = "`t</Strings>`n</Language>"
          if (-not $text.Contains($marker)) { throw 'Localization closing marker not found' }
          $insert = @(
            "`t`t<String Name=`"ExternalSearchAmule`">eD2k / Kad (aMule)</String>",
            "`t`t<String Name=`"ExternalSearchSearchMode`">Режим поиска</String>",
            "`t`t<String Name=`"ExternalSearchAmuleUrlRequired`">aMule включён, но URL amuleapi не задан.</String>",
            "`t`t<String Name=`"ExternalSearchAmulePasswordRequired`">aMule включён, но пароль администратора amuleapi не задан.</String>",
            "`t`t<String Name=`"ExternalSearchAmuleInsecureUrl`">Удалённый amuleapi требует HTTPS. Обычный HTTP разрешён только для localhost.</String>"
          ) -join "`n"
          $text = $text.Replace($marker, $insert + "`n" + $marker)
          [IO.File]::WriteAllText($langPath, $text, [Text.UTF8Encoding]::new($false))

          $xmlHash = (Get-FileHash $langPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xmlHash -ne '54939a9cdd42e4a8c4cb9fa379eb814a7303881e10ae13517bcd8717347a2d61') { throw "Stage 4 localization XML SHA256 mismatch: $xmlHash" }
          [xml]$xml = Get-Content $langPath -Raw -Encoding UTF8
          $nodes = @($xml.Language.Strings.String)
          if ($nodes.Count -ne 2021) { throw "Expected 2021 strings, got $($nodes.Count)" }
          $unique = @($nodes | ForEach-Object { $_.Name } | Sort-Object -Unique)
          if ($unique.Count -ne 2021) { throw "Expected 2021 unique string names, got $($unique.Count)" }
          if ($xml.Language.Revision -ne '5-sharp') { throw "Unexpected localization revision: $($xml.Language.Revision)" }
          foreach ($name in @('ExternalSearchSources','ExternalSearchAmule','ExternalSearchSearchMode','ExternalSearchAmuleUrlRequired','ExternalSearchAmulePasswordRequired','ExternalSearchAmuleInsecureUrl')) {
            if (-not ($nodes | Where-Object { $_.Name -eq $name })) { throw "Localization key missing: $name" }
          }
          if ($nodes | Where-Object { $_.Name -eq 'GreyBridgeSettings' }) { throw "Legacy GreyBridgeSettings localization is still present" }
          Write-Host "Russian localization OK: 2021/2021 unique, revision 5-sharp"

      - name: Make REPORT_FOR_CHATGPT Windows PowerShell 5.1 compatible
        shell: pwsh
        run: |
          $report = (Resolve-Path 'blacklink\compiled\REPORT_FOR_CHATGPT.ps1')
          $text = [IO.File]::ReadAllText($report, [Text.Encoding]::UTF8)
          [IO.File]::WriteAllText($report, $text, [Text.UTF8Encoding]::new($true))
          $bytes = [IO.File]::ReadAllBytes($report)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'REPORT_FOR_CHATGPT.ps1 UTF-8 BOM was not written'
          }
          Write-Host 'REPORT_FOR_CHATGPT.ps1 rewritten as UTF-8 BOM for Windows PowerShell 5.1'

      - name: Validate REPORT_FOR_CHATGPT PowerShell syntax
        shell: pwsh
        run: |
          $report = (Resolve-Path 'blacklink\compiled\REPORT_FOR_CHATGPT.ps1')
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($report, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ("REPORT_FOR_CHATGPT.ps1 syntax errors in pwsh:`n" + (($errors | ForEach-Object { $_.Message }) -join "`n"))
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [void][ScriptBlock]::Create([IO.File]::ReadAllText((Resolve-Path 'blacklink\compiled\REPORT_FOR_CHATGPT.ps1')))"
          if ($LASTEXITCODE -ne 0) { throw "REPORT_FOR_CHATGPT.ps1 failed Windows PowerShell 5.1 parse check with exit code $LASTEXITCODE" }
          Write-Host 'REPORT_FOR_CHATGPT.ps1 syntax OK in pwsh and Windows PowerShell 5.1'

      - name: Validate ExternalSearch runtime defaults
        shell: pwsh
        run: |
          [xml]$cfg = Get-Content 'blacklink\compiled\Settings\ExternalSearch.xml' -Raw -Encoding UTF8
          if ($cfg.ExternalSearch.Version -ne '3') { throw "Unexpected ExternalSearch config version: $($cfg.ExternalSearch.Version)" }
          if (-not $cfg.ExternalSearch.Amule) { throw 'Amule section missing from ExternalSearch.xml' }
          if ($cfg.ExternalSearch.Amule.BaseUrl -ne 'http://127.0.0.1:4713') { throw "Unexpected amuleapi default URL: $($cfg.ExternalSearch.Amule.BaseUrl)" }
          if ($cfg.ExternalSearch.Amule.SearchType -ne 'global') { throw "Unexpected default aMule search mode: $($cfg.ExternalSearch.Amule.SearchType)" }
          Write-Host 'ExternalSearch.xml Stage 4 defaults OK'

      - name: Setup MSBuild x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Preflight preinstalled VS2022 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio installation not found" }
          $toolRoot = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'bin\Hostx64\x64\cl.exe')) -and
              (Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h'))
            } |
            Select-Object -First 1
          if (-not $toolRoot) { throw "Preinstalled v143 compiler/ATL pair not found" }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $windowsH = Join-Path $sdkRoot 'Include\10.0.19041.0\um\Windows.h'
          $rc = Join-Path $sdkRoot 'bin\10.0.19041.0\x64\rc.exe'
          $mt = Join-Path $sdkRoot 'bin\10.0.19041.0\x64\mt.exe'
          $cl = Join-Path $toolRoot.FullName 'bin\Hostx64\x64\cl.exe'
          $atl = Join-Path $toolRoot.FullName 'atlmfc\include\atlbase.h'
          $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue
          if (-not $msbuild) { throw "MSBuild missing" }
          foreach ($required in @($cl, $atl, $windowsH, $rc, $mt)) {
            if (-not (Test-Path $required)) { throw "Required build file missing: $required" }
          }
          Write-Host "MSBuild: $($msbuild.Source)"
          Write-Host "MSVC/ATL root: $($toolRoot.FullName)"
          Write-Host "Windows SDK: 10.0.19041.0"

      - name: Build Release x64 with watchdog
        timeout-minutes: 20
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          $log = Join-Path $PWD 'msbuild.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $args = @(
            'blacklink\blacklink_2019.sln',
            '/m',
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:PlatformToolset=v143',
            '/verbosity:normal',
            '/fl',
            "/flp:logfile=$log;verbosity=diagnostic"
          )
          $p = Start-Process -FilePath $msbuild -ArgumentList $args -PassThru -NoNewWindow
          $lastProgress = Get-Date
          $lastLength = -1L
          while (-not $p.HasExited) {
            Start-Sleep -Seconds 15
            $p.Refresh()
            if (Test-Path $log) {
              $item = Get-Item $log
              if ($item.Length -ne $lastLength) {
                $lastLength = $item.Length
                $lastProgress = Get-Date
                Write-Host ("MSBuild progress: log {0:N0} bytes" -f $lastLength)
              }
            }
            if (((Get-Date) - $lastProgress).TotalSeconds -ge 240) {
              cmd /c "taskkill /PID $($p.Id) /T /F" | Out-Host
              throw "MSBuild watchdog: no progress for 4 minutes"
            }
          }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "MSBuild failed with exit code $($p.ExitCode)" }

      - name: Upload MSBuild diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackLink-custom-msbuild-log
          path: msbuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify executable and runtime files
        shell: pwsh
        run: |
          $required = @(
            'blacklink\compiled\blacklink_x64.exe',
            'blacklink\compiled\Lang\ru-RU.xml',
            'blacklink\compiled\Settings\ExternalSearch.xml',
            'blacklink\compiled\REPORT_FOR_CHATGPT.cmd',
            'blacklink\compiled\REPORT_FOR_CHATGPT.ps1'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required runtime file missing: $file" }
          }
          if (Test-Path 'blacklink\compiled\Settings\GreyBridge.xml') { throw 'Legacy GreyBridge.xml should not be packaged' }
          Get-Item $required | Format-Table Name,Length,LastWriteTime

      - name: Package BlackLink custom build
        shell: pwsh
        run: |
          if (Test-Path BlackLink-custom-x64.zip) { Remove-Item BlackLink-custom-x64.zip -Force }
          Compress-Archive -Path blacklink\compiled\* -DestinationPath BlackLink-custom-x64.zip -CompressionLevel Optimal
          if (-not (Test-Path BlackLink-custom-x64.zip)) { throw 'Package was not created' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackLink-custom-x64
          path: BlackLink-custom-x64.zip
          if-no-files-found: error
