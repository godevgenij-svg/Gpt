name: Temporary FIX62 Stress Max APK builder

on:
  pull_request:
    branches: [ main ]

jobs:
  build-stress-max:
    if: github.head_ref == 'fix62-stress-max-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          sha256sum fix62-stress-max/source.part00 fix62-stress-max/source.part01 fix62-stress-max/source.part02 fix62-stress-max/source.part03a fix62-stress-max/source.part03b fix62-stress-max/source.part04
          cat fix62-stress-max/source.part00 fix62-stress-max/source.part01 fix62-stress-max/source.part02 fix62-stress-max/source.part03a fix62-stress-max/source.part03b fix62-stress-max/source.part04 | tr -d '\n\r' | base64 -d > fix62_stress_max.tar.xz
          echo "1e69c9f4a033d9a3085ae219c357fd6cfa42858c0cdc08d83f1b8ea331def04c  fix62_stress_max.tar.xz" | sha256sum -c -
          tar -xJf fix62_stress_max.tar.xz

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: fix62_stress
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f fix62_stress/app/build/outputs/apk/debug/app-debug.apk
          unzip -t fix62_stress/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l fix62_stress/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libfix62stress.so'

      - uses: actions/upload-artifact@v4
        with:
          name: FIX62-Stress-Max-APK
          path: fix62_stress/app/build/outputs/apk/debug/app-debug.apk
