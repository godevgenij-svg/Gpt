name: Build portable backend pack v2

on:
  push:
    branches: [ backend-pack-ready ]
    paths:
      - 'backend_pack/BuildPack.ps1'
      - '.github/workflows/build-backend-pack-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test bundle
        shell: pwsh
        run: |
          ./backend_pack/BuildPack.ps1 -OutputDirectory ./backend_pack/out

      - name: Upload ready bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackLink_Backends_Ready_x64
          path: |
            backend_pack/out/BlackLink_Backends_Ready_x64.zip
            backend_pack/out/BlackLink_Backends_Ready_x64.sha256.txt
          if-no-files-found: error
          retention-days: 30
