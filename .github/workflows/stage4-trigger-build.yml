name: Stage 4 clean-build dispatcher

on:
  workflow_dispatch:
  push:
    branches: [ stage4-ed2k-from-stage3 ]
    paths:
      - '.github/workflows/stage4-trigger-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Stage 4 clean x64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stage4-build.yml --ref stage4-ed2k-from-stage3 --repo "$GITHUB_REPOSITORY"
