name: MEMS Catalog Parser v0.2 Windows build

on:
  push:
    branches:
      - mems-catalog-parser-v0.2-savealways
    paths:
      - 'MemsCatalogParser/**'
      - '.github/workflows/mems-catalog-parser-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\MemsCatalogParser\requirements.txt

      - name: Build Windows x64
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name MEMS_Catalog_Parser `
            --collect-all playwright `
            --collect-all xlsxwriter `
            .\MemsCatalogParser\app.py
          Copy-Item .\MemsCatalogParser\README_RU.txt .\dist\MEMS_Catalog_Parser\README_RU.txt

      - name: Self-test packaged parser
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\MEMS_Catalog_Parser\MEMS_Catalog_Parser.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          Write-Host "Self-test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Parser self-test failed: $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\MEMS_Catalog_Parser\* -DestinationPath .\MEMS_Catalog_Parser_v0.2_win-x64.zip -Force
          $hash = (Get-FileHash .\MEMS_Catalog_Parser_v0.2_win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMS-Catalog-Parser-v0.2-win-x64
          path: MEMS_Catalog_Parser_v0.2_win-x64.zip
          if-no-files-found: error
