name: MEMS Catalog Parser Windows build

on:
  push:
    branches:
      - mems-catalog-parser-v0.1
    paths:
      - 'MemsCatalogParser/**'
      - '.github/workflows/mems-catalog-parser-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply minimal auth fix
        shell: pwsh
        run: |
          $p = '.\MemsCatalogParser\parser_core.py'
          $s = Get-Content $p -Raw -Encoding UTF8
          $s = $s.Replace('APP_VERSION = "0.1.0"', 'APP_VERSION = "0.1.1"')
          $s = $s.Replace('CARD = "div.card"', 'CARD = "div.card:has(div.font-mono):has(a[href*=\"/catalog/\"])"')
          $old = @'
def wait_auth_catalog(page: Page, stop: threading.Event, status: Callable[[str], None], log: Log):
    until = time.monotonic() + 600
    while time.monotonic() < until:
        if stop.is_set():
            raise RuntimeError("Остановлено пользователем")
        try:
            if "b2b-mems.ru" in page.url and page.locator(CARD).count() > 0:
                return
        except Exception:
            pass
        status("Если MEMS просит вход — авторизуйтесь в открытом Chrome. Продолжение автоматическое.")
        time.sleep(1)
    raise TimeoutError("Каталог не открылся за 10 минут")
'@
          $new = @'
def wait_auth_catalog(page: Page, stop: threading.Event, status: Callable[[str], None], log: Log):
    until = time.monotonic() + 600
    last_catalog_open = 0.0
    while time.monotonic() < until:
        if stop.is_set():
            raise RuntimeError("Остановлено пользователем")
        try:
            url = page.url or ""
            if "/catalog" in url and page.locator(CARD).count() > 0:
                log.write(f"Catalog ready after auth: {url}")
                return
            if "/login" not in url and time.monotonic() - last_catalog_open > 3:
                last_catalog_open = time.monotonic()
                try:
                    page.goto(CATALOG_URL, wait_until="domcontentloaded", timeout=15000)
                except Exception:
                    pass
        except Exception:
            pass
        status("Войдите в MEMS в открытом Chrome. После входа парсер сам продолжит.")
        time.sleep(1)
    raise TimeoutError("Не дождался авторизации и каталога за 10 минут")
'@
          if (-not $s.Contains($old)) { throw 'wait_auth_catalog block not found' }
          $s = $s.Replace($old, $new)
          Set-Content $p $s -Encoding UTF8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r .\MemsCatalogParser\requirements.txt

      - name: Build Windows x64
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name MEMS_Catalog_Parser `
            --collect-all playwright `
            --collect-all xlsxwriter `
            .\MemsCatalogParser\app.py
          Copy-Item .\MemsCatalogParser\README_RU.txt .\dist\MEMS_Catalog_Parser\README_RU.txt

      - name: Self-test packaged parser
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\MEMS_Catalog_Parser\MEMS_Catalog_Parser.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          Write-Host "Self-test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Parser self-test failed: $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\MEMS_Catalog_Parser\* -DestinationPath .\MEMS_Catalog_Parser_v0.1.1_win-x64.zip -Force
          $hash = (Get-FileHash .\MEMS_Catalog_Parser_v0.1.1_win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMS-Catalog-Parser-v0.1.1-win-x64
          path: MEMS_Catalog_Parser_v0.1.1_win-x64.zip
          if-no-files-found: error
