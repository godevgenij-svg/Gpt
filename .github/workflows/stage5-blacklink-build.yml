name: Stage 5 BlackLink Gnutella compile proof

on:
  workflow_dispatch:
  push:
    branches: [ stage5-gnutella ]
    paths:
      - '.github/workflows/stage5-blacklink-build.yml'
      - 'stage5/blacklink_gnutella.patch.gz.b64'

concurrency:
  group: stage5-blacklink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout Stage 5 control files
        uses: actions/checkout@v4

      - name: Reconstruct and verify Stage 2 base patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\ci2.part*" | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 Stage 2 chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 30604) { throw "Unexpected Stage 2 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage2.patch.xz", [Convert]::FromBase64String($b64))
          if ((Get-FileHash "$PWD\Stage2.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ff95c6073cde34ff3af0e082c06e5131273f4544a9ee81686d7420d9aba7f05b') { throw 'Stage 2 XZ hash mismatch' }
          cmd /c "7z x Stage2.patch.xz -so > Stage2.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$PWD\Stage2.patch" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c120d913ac679d4b494d6ac7877b50c1e96beb431dac5bbc4912cf617ab31999') { throw 'Stage 2 patch hash mismatch' }

      - name: Clone pinned BlackLink upstream
        shell: pwsh
        run: |
          git clone https://github.com/zipper9/blacklink.git blacklink
          git -C blacklink checkout 1a72cfddca154da9070caca1b5a02df56d5498ab
          if ((git -C blacklink rev-parse HEAD).Trim() -ne '1a72cfddca154da9070caca1b5a02df56d5498ab') { throw 'Wrong BlackLink upstream commit' }

      - name: Apply Stage 2 source chain
        shell: pwsh
        run: |
          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          & $patchExe -p2 -d blacklink -i "$PWD\Stage2.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply --check ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../patches/GreyLink_Stage2_MakeDefs_hotfix.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $patchExe -p2 -d blacklink -i "$PWD\patches\GreyLink_Stage2_compilefix1.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $patchExe -p1 -d blacklink -i "$PWD\patches\GreyLink_RU_runtimefix.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanitize StringDefs before feature patches
        shell: pwsh
        run: |
          $path = "blacklink\client\StringDefs.h"
          $text = Get-Content $path -Raw
          $text = $text -replace '(?m)^[ \t]*// Additional UI strings localized by the Russian localization patch\r?\n', ''
          $text = $text -replace '(?m)^[ \t]*// GreyBridge multi-network UI\r?\n', ''
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

      - name: Reconstruct verify and apply Stage 3
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patches\stage3.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 Stage 3 chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 24024) { throw "Unexpected Stage 3 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage3.patch.xz", [Convert]::FromBase64String($b64))
          if ((Get-FileHash "$PWD\Stage3.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ed453da31122b6cec97566b119ff119c25cf34f9d3cc4b7b7cfd94b40926f8ff') { throw 'Stage 3 XZ hash mismatch' }
          cmd /c "7z x Stage3.patch.xz -so > Stage3.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$PWD\Stage3.patch" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '54eb0e38f49c355f48c4c0894dbd527bc5aa446295b8ea681aa233c52cabc58c') { throw 'Stage 3 patch hash mismatch' }
          git -C blacklink apply --check ../Stage3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconstruct verify and apply Stage 4
        shell: pwsh
        run: |
          $b64 = Get-Content "patches\stage4.b64" -Raw
          if ($b64.Length -ne 16592) { throw "Unexpected Stage 4 base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("$PWD\Stage4.patch.xz", [Convert]::FromBase64String($b64))
          if ((Get-FileHash "$PWD\Stage4.patch.xz" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '436973d902c0b40df908de961eb829f86fca86b6e436febc013b4a32b3bc6815') { throw 'Stage 4 XZ hash mismatch' }
          cmd /c "7z x Stage4.patch.xz -so > Stage4.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$PWD\Stage4.patch" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1828691e8cd7407b915f1dcd5ae7d54a3243787eddce36610b65851098e4b063') { throw 'Stage 4 patch hash mismatch' }
          git -C blacklink apply --check ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink apply ../Stage4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconstruct verify and apply Stage 5 Gnutella provider
        shell: pwsh
        run: |
          $raw = (Get-Content 'stage5\blacklink_gnutella.patch.gz.b64' -Raw) -replace '\s',''
          try { $gzipBytes = [Convert]::FromBase64String($raw) } catch { throw "Invalid Stage 5 base64 payload: $($_.Exception.Message)" }
          $input = [IO.MemoryStream]::new($gzipBytes)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create("$PWD\Stage5.patch")
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
          $hash = (Get-FileHash "$PWD\Stage5.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f1beca5e45b574e182d77e526acb94831e96c8002a92bdbaa12f0778e9f062c4') { throw "Stage 5 patch hash mismatch: $hash" }

          # Stage 3/4 are applied by git on Windows and leave these files CRLF, while the
          # Stage 5 patch was generated from the exact source snapshot using LF. Normalize
          # only the Stage 5 patch targets so patch application is deterministic.
          foreach ($target in @(
            'blacklink\client\ExternalSearchManager.h',
            'blacklink\client\ExternalSearchManager.cpp',
            'blacklink\compiled\Settings\ExternalSearch.xml'
          )) {
            $resolved = Resolve-Path $target
            $text = [IO.File]::ReadAllText($resolved, [Text.Encoding]::UTF8).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($resolved, $text, [Text.UTF8Encoding]::new($false))
          }

          $patchExe = "C:\Program Files\Git\usr\bin\patch.exe"
          & $patchExe -p1 -d blacklink -i "$PWD\Stage5.patch" --batch --forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C blacklink diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Stage 5 source and config
        shell: pwsh
        run: |
          $cpp = Get-Content 'blacklink\client\ExternalSearchManager.cpp' -Raw
          foreach ($marker in @('NETWORK_GNUTELLA','REQ_GNUTELLA_SEARCH','/v1/search','/v1/download')) {
            if (-not $cpp.Contains($marker)) { throw "Stage 5 source marker missing: $marker" }
          }
          [xml]$cfg = Get-Content 'blacklink\compiled\Settings\ExternalSearch.xml' -Raw -Encoding UTF8
          if ($cfg.ExternalSearch.Version -ne '4') { throw "Unexpected ExternalSearch version: $($cfg.ExternalSearch.Version)" }
          if (-not $cfg.ExternalSearch.Gnutella) { throw 'Gnutella config section missing' }
          if ($cfg.ExternalSearch.Gnutella.BaseUrl -ne 'http://127.0.0.1:47831') { throw 'Unexpected Gnutella bridge URL' }
          if ($cfg.ExternalSearch.Gnutella.Enabled -ne '0') { throw 'Gnutella must remain opt-in in the base config' }

      - name: Setup MSBuild x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Preflight VS2022 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -property installationPath).Trim()
          if (-not $vsPath) { throw 'Visual Studio installation not found' }
          $toolRoot = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -ErrorAction Stop | Sort-Object Name -Descending | Where-Object {
            (Test-Path (Join-Path $_.FullName 'bin\Hostx64\x64\cl.exe')) -and (Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h'))
          } | Select-Object -First 1
          if (-not $toolRoot) { throw 'Preinstalled v143 compiler/ATL pair not found' }
          if (-not (Get-Command msbuild -ErrorAction SilentlyContinue)) { throw 'MSBuild missing' }

      - name: Build Release x64
        timeout-minutes: 20
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          & $msbuild 'blacklink\blacklink_2019.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /verbosity:minimal /fl /flp:"logfile=$PWD\msbuild-stage5.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'blacklink\compiled\blacklink_x64.exe')) { throw 'blacklink_x64.exe missing after build' }

      - name: Upload compile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage5-BlackLink-Gnutella-compile-proof
          path: |
            blacklink/compiled/blacklink_x64.exe
            blacklink/compiled/Settings/ExternalSearch.xml
            msbuild-stage5.log
          if-no-files-found: warn
          retention-days: 7
