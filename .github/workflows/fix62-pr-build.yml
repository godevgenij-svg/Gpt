name: Temporary FIX62 APK builder

on:
  pull_request:
    branches: [ main ]

jobs:
  build-fix62:
    if: github.head_ref == 'fix62-android-build'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          cat fix62-build/srcxz.part* | tr -d '\n\r' | base64 -d > fix62_android_src.tar.xz
          tar -xJf fix62_android_src.tar.xz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: fix62_android
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FIX62-Diagnostics-APK
          path: fix62_android/app/build/outputs/apk/debug/app-debug.apk
