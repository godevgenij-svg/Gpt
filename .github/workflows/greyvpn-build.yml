name: GreyVPN Windows build

on:
  push:
    branches:
      - greyvpn-v0.1
      - greyvpn-v0.2
      - greyvpn-v0.3
      - greyvpn-v0.4
      - greyvpn-v0.5
    paths:
      - 'GreyVPN/**'
      - '.github/workflows/greyvpn-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\GreyVPN\src\GreyVPN\GreyVPN.csproj

      - name: Publish win-x64
        run: dotnet publish .\GreyVPN\src\GreyVPN\GreyVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\GreyVPN\publish

      - name: Bundle sing-box 1.13.19
        shell: pwsh
        run: |
          $url = 'https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive sing-box.zip -DestinationPath sing-box-dist
          New-Item -ItemType Directory -Force -Path .\GreyVPN\publish\engines | Out-Null
          $exe = Get-ChildItem sing-box-dist -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe not found in official archive' }
          Copy-Item $exe.FullName .\GreyVPN\publish\engines\sing-box.exe
          .\GreyVPN\publish\engines\sing-box.exe version
          @"
          sing-box 1.13.19
          Source: https://github.com/SagerNet/sing-box
          License: GPL-3.0-or-later
          Binary downloaded from the official GitHub release during CI build.
          "@ | Set-Content -Encoding UTF8 .\GreyVPN\publish\engines\THIRD_PARTY_sing-box.txt

      - name: Bundle OpenVPN 2.6.22 Wintun engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.22-I001-amd64.msi'
          Invoke-WebRequest -Uri $url -OutFile openvpn.msi
          $msi = (Resolve-Path .\openvpn.msi).Path
          $extract = Join-Path (Get-Location) 'openvpn-dist'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $args = @('/a', $msi, '/qn', "TARGETDIR=$extract")
          $p = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OpenVPN MSI administrative extraction failed: $($p.ExitCode)" }

          $openvpn = Get-ChildItem $extract -Recurse -Filter openvpn.exe | Select-Object -First 1
          if (-not $openvpn) { throw 'openvpn.exe not found after MSI extraction' }

          $engineDir = '.\GreyVPN\publish\engines\openvpn'
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Copy-Item (Join-Path $openvpn.Directory.FullName '*') $engineDir -Recurse -Force

          $wintun = Get-ChildItem $extract -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64|x64|Win10' } | Select-Object -First 1
          if (-not $wintun) { $wintun = Get-ChildItem $extract -Recurse -Filter wintun.dll | Select-Object -First 1 }
          if (-not $wintun) { throw 'wintun.dll not found in official OpenVPN 2.6.22 MSI' }
          Copy-Item $wintun.FullName (Join-Path $engineDir 'wintun.dll') -Force

          & (Join-Path $engineDir 'openvpn.exe') --version | Select-Object -First 2
          @"
          OpenVPN Community 2.6.22-I001 amd64
          Source: https://community.openvpn.net/Downloads
          Binary: official OpenVPN Community Windows MSI, administratively extracted during CI build.
          Wintun is used only for isolated real-test sessions. GreyVPN must be elevated for this test.
          OpenVPN licensing notices apply to the bundled binary and libraries.
          "@ | Set-Content -Encoding UTF8 (Join-Path $engineDir 'THIRD_PARTY_OpenVPN.txt')

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreyVPN-v0.5-win-x64
          path: GreyVPN\publish\**
          if-no-files-found: error
