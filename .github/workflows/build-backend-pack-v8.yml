name: Build portable backend pack v8

on:
  push:
    branches: [ backend-pack-ready ]
    paths:
      - 'backend_pack/BackendPackV8.ps1'
      - 'backend_pack/BuildPackV8.ps1'
      - '.github/workflows/build-backend-pack-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and full smoke test
        shell: pwsh
        run: ./backend_pack/BuildPackV8.ps1 -OutputDirectory ./backend_pack/out
      - name: Upload ready bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackLink_Backends_Ready_x64_v8
          path: |
            backend_pack/out/BlackLink_Backends_Ready_x64_v8.zip
            backend_pack/out/BlackLink_Backends_Ready_x64_v8.sha256.txt
          if-no-files-found: error
          retention-days: 30
