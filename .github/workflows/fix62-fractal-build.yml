name: Temporary FIX62 Stress Fractal APK builder

on:
  pull_request:
    branches: [ main ]

jobs:
  build-fractal:
    if: github.head_ref == 'fix62-stress-max-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore project
        run: |
          cat fix62-fractal/source.part* | tr -d '\n\r' | base64 -d > fix62_fractal.tar.xz
          tar -xJf fix62_fractal.tar.xz

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK/NDK/CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: fix62_stress
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f fix62_stress/app/build/outputs/apk/debug/app-debug.apk
          unzip -t fix62_stress/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: FIX62-Stress-Fractal-APK
          path: fix62_stress/app/build/outputs/apk/debug/app-debug.apk
